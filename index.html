<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Website</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #f5f5f5;
      animation: fadeIn 1.5s ease-in;
    }

    /* Fade in animation */
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .box-text {
      font-size: 50px;
      padding: 20px 40px;
      margin: 50px auto;
      border: 3px solid red;
      border-radius: 40px;
      width: fit-content;
      transition: all 1s ease;
      cursor: pointer;
      background-color: white;
      animation: zoomIn 1.2s ease;
    }

    @keyframes zoomIn {
      from { transform: scale(0.5); }
      to { transform: scale(1); }
    }

    .box-text:hover {
      transform: scale(1.3);
      background-color: #A47864;
      color: white;
    }

    ul {
      list-style-type: none;
      padding: 0;
    }

    li {
      margin-bottom: 40px;
      animation: slideUp 1s ease forwards;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(40px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    h3 {
      color: orange;
    }

    a {
      text-decoration: none;
    }

    h1 {
      color: red;
      transition: transform 0.3s ease;
    }

    h1:hover {
      transform: scale(1.1);
    }

    .pulse {
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }
  </style>
</head>

<body>

  <div class="box-text">Welcome</div>

  <ul>
    <li>
      <h3>If you want to see any web series in this world</h3>
      <a href="https://bolly4u.immo/" target="_blank">
        <h1>bolly4u</h1>
      </a>
    </li>

    <li>
      <h3>If you want to learn something new</h3>
      <a href="https://learning.sap.com/" target="_blank">
        <h1>SAP</h1>
      </a>
    </li>

    <li>
      <h3>If you want to search something</h3>
      <a href="https://chatgpt.com/" target="_blank">
        <h1>ChatGPT</h1>
      </a>
    </li>

    <li>
      <h3>If you want to see videos</h3>
      <a href="https://www.youtube.com/" target="_blank">
        <h1>YouTube</h1>
      </a>

      <h3>If you want to see movies</h3>
      <a href="https://www.primevideo.com/" target="_blank">
        <h1>Prime Video</h1>
      </a>
    </li>
  </ul>

  <h1 class="pulse">See you soon</h1>

</body>
</html>
